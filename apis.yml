aid: push-security
name: Push Security
description: >-
  Push Security is an AI-native browser security platform that deploys as a
  lightweight enterprise browser extension to every employee, giving security
  teams real-time telemetry, autonomous threat-hunting agents, and deep browser
  visibility across the full identity and browser attack surface. From the
  browser, Push tracks logins, AI-tool usage, and identity events to stop
  advanced identity attacks (account takeover, zero-day phishing, ClickFix,
  malicious OAuth integrations, session hijacking), discover shadow AI and shadow
  SaaS, harden unmanaged identities, and accelerate incident response. Push
  exposes a REST API (v1) and webhooks to programmatically administer the
  platform and forward events to SIEM/SOAR and ticketing systems. Backed by GV
  and Redpoint Ventures.
